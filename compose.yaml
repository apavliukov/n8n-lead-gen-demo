services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?set N8N_VERSION in .env}
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678" # exposed only through an HTTPS reverse proxy
    environment:
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - WEBHOOK_URL=${N8N_PUBLIC_URL}
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL}
      - N8N_PROXY_HOPS=1
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336 # hours
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 700m
    dns:
      - 1.1.1.1
      - 8.8.8.8

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432" # for a database client over an SSH tunnel; 5432 on a Synology host belongs to DSM's own Postgres
    volumes:
      - postgres_data:/var/lib/postgresql # postgres 18+ images keep data in a versioned subdirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  # Development mail catcher: accepts everything on SMTP 1025 and delivers nothing.
  # Starts only with COMPOSE_PROFILES=dev in .env; production uses a real SMTP provider instead.
  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # web UI, no auth: reach it through an SSH tunnel or the reverse proxy
    mem_limit: 64m

volumes:
  n8n_data:
  postgres_data:
