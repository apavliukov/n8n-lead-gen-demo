# Disposable test stand: n8n, Postgres, Mailpit and a stub for HubSpot, Meta and Telegram.
# Nothing is persisted and nothing leaves the machine. Managed by scripts/stand.sh.
name: leadgen-test

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.48.7}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5680:5678"
    environment:
      - TZ=UTC
      - GENERIC_TIMEZONE=UTC
      - WEBHOOK_URL=http://localhost:5680
      - N8N_ENCRYPTION_KEY=test-stand
      - N8N_DIAGNOSTICS_ENABLED=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=test

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8026:8025"

  stub:
    image: node:24-alpine
    command: node /stub/server.mjs
    init: true
    volumes:
      - ./tests/stub:/stub:ro
    ports:
      - "127.0.0.1:8090:8080"
